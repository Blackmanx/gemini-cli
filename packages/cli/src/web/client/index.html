<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini CLI</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --bg-subtle: #f6f7f9;
        --bg-elevated: #ffffff;
        --bg-hover: #eceef1;
        /* Enough contrast to read at 11px on a pale background. */
        --text: #1b1c1e;
        --text-muted: #494c50;
        --text-faint: #5f6368;
        --border: #d6d9dd;
        --accent: #8ab4f8;
        --accent-strong: #1a73e8;
        --accent-soft: #e8f0fe;
        --danger: #c5221f;
        --success: #137333;
        --code-bg: #f6f8fa;
        --diff-add-bg: #e6f4ea;
        --diff-add-text: #0b6b2f;
        --diff-del-bg: #fce8e6;
        --diff-del-text: #a50e0e;
        --shadow:
          0 1px 2px rgba(60, 64, 67, 0.3), 0 2px 6px 2px rgba(60, 64, 67, 0.15);
        --radius: 12px;
        --mono: 'Roboto Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
        --sans:
          'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Helvetica, Arial, sans-serif;
      }

      html[data-theme='dark'] {
        --bg: #131314;
        --bg-subtle: #1e1f20;
        --bg-elevated: #282a2c;
        --bg-hover: #303134;
        --text: #e3e3e3;
        --text-muted: #9aa0a6;
        --text-faint: #80868b;
        --border: #3c4043;
        --accent: #8ab4f8;
        --accent-strong: #a8c7fa;
        --accent-soft: #1f2a3a;
        --danger: #f28b82;
        --success: #81c995;
        --code-bg: #202124;
        --diff-add-bg: #1b3325;
        --diff-add-text: #9cdcae;
        --diff-del-bg: #3a1f1e;
        --diff-del-text: #f2b8b5;
        --shadow:
          0 1px 2px rgba(0, 0, 0, 0.4), 0 2px 6px 2px rgba(0, 0, 0, 0.3);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--sans);
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      button {
        font-family: inherit;
        font-size: inherit;
        cursor: pointer;
      }

      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 5px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-faint);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <link rel="stylesheet" href="/assets/main.css" />
    <script type="module" src="/assets/main.js"></script>
  </body>
</html>
